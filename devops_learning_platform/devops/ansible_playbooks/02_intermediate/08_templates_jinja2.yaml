# 08_templates_jinja2.yaml — Jinja2 templates for dynamic config files
# Usage: ansible-playbook -i inventory/hosts.ini 02_intermediate/08_templates_jinja2.yaml
# Templates use .j2 extension and go in the templates/ folder

# --- PLAYBOOK ---
---
- name: Deploy Nginx config using Jinja2 template
  hosts: webservers
  become: true

  vars:
    server_name: "app.example.com"
    app_port: 8000
    ssl_enabled: true
    worker_processes: "{{ ansible_processor_vcpus }}"   # dynamic from facts

  tasks:
    - name: Deploy nginx config from template
      ansible.builtin.template:
        src: templates/nginx_vhost.conf.j2
        dest: /etc/nginx/sites-available/app
        owner: root
        group: root
        mode: "0644"
        validate: "nginx -t -c %s"   # validate before placing file
      notify: Reload nginx

    - name: Enable the site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

