# 05_users_and_groups.yaml — Manage users, groups, and SSH keys
# Usage: ansible-playbook -i inventory/hosts.ini 01_basics/05_users_and_groups.yaml
---
- name: Manage users and groups
  hosts: all
  become: true

  vars:
    app_user: appuser
    deploy_users:
      - name: alice
        groups: sudo
        shell: /bin/bash
      - name: bob
        groups: docker
        shell: /bin/bash

  tasks:
    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_user }}"
        state: present
        system: true

    - name: Create application user (no login shell)
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_user }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        state: present

    - name: Create deploy users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        shell: "{{ item.shell }}"
        create_home: true
        state: present
      loop: "{{ deploy_users }}"

    - name: Add SSH authorized key for alice
      ansible.posix.authorized_key:
        user: alice
        state: present
        key: "{{ lookup('file', '~/.ssh/alice.pub') }}"

    - name: Remove a user and their home directory
      ansible.builtin.user:
        name: olduser
        state: absent
        remove: true
