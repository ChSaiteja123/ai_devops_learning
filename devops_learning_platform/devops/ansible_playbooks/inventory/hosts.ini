# inventory/hosts.ini — Ansible inventory file
# Usage: ansible-playbook -i inventory/hosts.ini playbook.yml

[webservers]
web01 ansible_host=10.0.1.10 ansible_user=ubuntu
web02 ansible_host=10.0.1.11 ansible_user=ubuntu

[dbservers]
db01  ansible_host=10.0.2.10 ansible_user=ubuntu

[monitoring]
mon01 ansible_host=10.0.3.10 ansible_user=ubuntu

# Group of groups
[production:children]
webservers
dbservers
monitoring

[production:vars]
ansible_ssh_private_key_file=~/.ssh/prod-key.pem
ansible_python_interpreter=/usr/bin/python3
