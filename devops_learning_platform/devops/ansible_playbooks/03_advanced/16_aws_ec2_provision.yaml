# 16_aws_ec2_provision.yaml — Provision AWS EC2 instances with Ansible
# Requires: pip install boto3 botocore
# Usage: ansible-playbook 03_advanced/16_aws_ec2_provision.yaml
---
- name: Provision EC2 instances on AWS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: us-east-1
    instance_type: t3.micro
    ami_id: ami-0c02fb55956c7d316      # Amazon Linux 2023
    key_name: my-keypair
    vpc_subnet_id: subnet-0123456789
    security_group: sg-0123456789
    instance_count: 2
    environment: dev
    project: myapp

  tasks:
    - name: Create EC2 key pair (if not exists)
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ region }}"
        state: present
      register: keypair

    - name: Save private key locally if new
      ansible.builtin.copy:
        content: "{{ keypair.key.private_key }}"
        dest: "~/.ssh/{{ key_name }}.pem"
        mode: "0600"
      when: keypair.changed

    - name: Launch EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ project }}-{{ environment }}-web"
        key_name: "{{ key_name }}"
        region: "{{ region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        subnet_id: "{{ vpc_subnet_id }}"
        security_groups:
          - "{{ security_group }}"
        count: "{{ instance_count }}"
        wait: true
        wait_timeout: 300
        state: running
        tags:
          Name: "{{ project }}-{{ environment }}-web"
          Environment: "{{ environment }}"
          Project: "{{ project }}"
          ManagedBy: ansible
      register: ec2_result

    - name: Add new instances to dynamic group
      ansible.builtin.add_host:
        name: "{{ item.public_ip_address }}"
        groups: newly_created
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ key_name }}.pem"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
      loop: "{{ ec2_result.instances }}"

    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        timeout: 120
      loop: "{{ ec2_result.instances }}"

- name: Configure newly provisioned EC2 instances
  hosts: newly_created
  become: true
  gather_facts: true

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install common utilities
      ansible.builtin.dnf:
        name:
          - nginx
          - git
          - python3-pip
        state: present
