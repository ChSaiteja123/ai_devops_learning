# 15_hardening.yaml — Linux server hardening playbook
# Usage: ansible-playbook -i inventory/hosts.ini 03_advanced/15_hardening.yaml
# WARNING: Test in dev first — SSH hardening can lock you out if misconfigured
---
- name: Harden Linux servers (CIS baseline)
  hosts: all
  become: true

  vars:
    ssh_port: 22
    allowed_ssh_users:
      - ubuntu
      - deploy
    ntp_servers:
      - 169.254.169.123    # AWS NTP
      - pool.ntp.org

  tasks:
    # ── SSH Hardening ──────────────────────────────────────────────
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: "sshd -t -f %s"
      loop:
        - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
        - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
        - { regexp: "^#?LoginGraceTime", line: "LoginGraceTime 30" }
        - { regexp: "^#?Protocol", line: "Protocol 2" }
        - { regexp: "^#?AllowUsers", line: "AllowUsers {{ allowed_ssh_users | join(' ') }}" }
      notify: Restart SSH

    # ── Firewall ───────────────────────────────────────────────────
    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Allow HTTP/HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    # ── System Settings ────────────────────────────────────────────
    - name: Disable unused filesystems
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/cis.conf
        line: "install {{ item }} /bin/true"
        create: true
        mode: "0644"
      loop:
        - cramfs
        - freevxfs
        - jffs2
        - hfs
        - hfsplus
        - udf

    - name: Set kernel security parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { key: net.ipv4.ip_forward, value: "0" }
        - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
        - { key: net.ipv4.conf.all.log_martians, value: "1" }
        - { key: kernel.randomize_va_space, value: "2" }

    # ── Audit Logging ──────────────────────────────────────────────
    - name: Install auditd
      ansible.builtin.apt:
        name: auditd
        state: present

    - name: Enable and start auditd
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

    # ── Automatic Updates ──────────────────────────────────────────
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted
