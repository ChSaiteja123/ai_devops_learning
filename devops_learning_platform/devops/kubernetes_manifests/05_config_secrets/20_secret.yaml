# 20_secret.yaml — Secret: sensitive configuration
# Values must be base64-encoded when using stringData: or data:
# Usage: kubectl apply -f 20_secret.yaml -n dev
#
# Create from command line (preferred — avoids YAML with b64 values):
# kubectl create secret generic app-secret \
#   --from-literal=db-password='MyP@ssw0rd!' \
#   --from-literal=api-key='sk-abc123xyz' \
#   -n dev
#
# Create TLS secret:
# kubectl create secret tls app-tls --cert=tls.crt --key=tls.key -n dev

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: dev
type: Opaque
stringData:           # stringData auto-encodes to base64 — safe for YAML
  db-password: "ReplaceWithVaultOrExternalSecret"
  api-key: "ReplaceWithVaultOrExternalSecret"
  database-url: "postgresql://appuser:password@postgres:5432/appdb"
