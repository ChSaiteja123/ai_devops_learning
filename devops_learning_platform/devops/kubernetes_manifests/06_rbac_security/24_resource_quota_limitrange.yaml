# 24_resource_quota_limitrange.yaml — ResourceQuota + LimitRange for namespace governance
# Usage: kubectl apply -f 24_resource_quota_limitrange.yaml -n dev

# ResourceQuota: total limits for the whole namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    # Compute
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    # Object counts
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"
    secrets: "20"
    configmaps: "20"
---
# LimitRange: default requests/limits per container (prevents unlimited containers)
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limitrange
  namespace: dev
spec:
  limits:
    - type: Container
      default:              # applied if container has no limits set
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:       # applied if container has no requests set
        cpu: "100m"
        memory: "128Mi"
      max:                  # container cannot exceed this
        cpu: "2"
        memory: "2Gi"
      min:                  # container must request at least this
        cpu: "50m"
        memory: "64Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "50Gi"
      min:
        storage: "1Gi"
