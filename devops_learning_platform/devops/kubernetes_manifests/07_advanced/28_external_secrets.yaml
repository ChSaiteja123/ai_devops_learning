# 28_external_secrets.yaml — ExternalSecret: sync secrets from AWS Secrets Manager
# Prerequisite: external-secrets operator installed
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets
# Usage: kubectl apply -f 28_external_secrets.yaml -n dev

# SecretStore: connection config to the secret backend
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: webapp-sa    # must have IRSA role with secretsmanager:GetSecretValue
---
# ExternalSecret: fetch specific keys from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-external-secret
  namespace: dev
spec:
  refreshInterval: 1h           # re-sync every hour
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secret             # creates a regular Kubernetes Secret
    creationPolicy: Owner
  data:
    - secretKey: db-password     # key in K8s secret
      remoteRef:
        key: /production/app     # path in AWS Secrets Manager
        property: db_password    # JSON key within the secret
    - secretKey: api-key
      remoteRef:
        key: /production/app
        property: api_key
