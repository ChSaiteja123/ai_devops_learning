# 26_sidecar_containers.yaml — Sidecar pattern: logging, proxies, service mesh
# Use cases: log shipping, metrics collection, Envoy proxy, secret rotation
# Usage: kubectl apply -f 26_sidecar_containers.yaml -n dev

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-with-sidecar
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        # Main application container
        - name: webapp
          image: myapp:v1.2
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app

        # Sidecar 1: log shipper (Fluent Bit)
        - name: log-shipper
          image: fluent/fluent-bit:2.2
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app
              readOnly: true
            - name: fluentbit-config
              mountPath: /fluent-bit/etc
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"

        # Sidecar 2: metrics exporter
        - name: metrics-exporter
          image: prom/statsd-exporter:v0.26.0
          ports:
            - containerPort: 9102
              name: metrics
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"

      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: fluentbit-config
          configMap:
            name: fluentbit-config
