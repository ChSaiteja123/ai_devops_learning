# 29_kustomize_overlay/kustomization.yaml — Production overlay with Kustomize
# Base: ../../01_basics/03_deployment_basic.yaml
# Usage: kubectl apply -k kubernetes_manifests/07_advanced/29_kustomize_overlay/
# Preview: kubectl kustomize kubernetes_manifests/07_advanced/29_kustomize_overlay/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

bases:
  - ../../01_basics  # reuse base manifests

commonLabels:
  environment: production
  managed-by: kustomize

images:
  - name: nginx
    newTag: "1.25-alpine"      # override image tag for production

replicas:
  - name: nginx-deployment
    count: 5                   # scale to 5 in production

patches:
  - target:
      kind: Deployment
      name: nginx-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
