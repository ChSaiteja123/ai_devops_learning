# 25_init_containers.yaml — Init Containers: run before main container starts
# Use cases: wait for DB, run migrations, fetch secrets, chmod volumes
# Usage: kubectl apply -f 25_init_containers.yaml -n dev

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-with-init
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      initContainers:
        # Init 1: wait for postgres to be ready before app starts
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do
                echo "postgres not ready, sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is ready!"

        # Init 2: run database migrations
        - name: run-migrations
          image: myapp:v1.2
          command: ["python", "manage.py", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: database-url

      containers:
        - name: webapp
          image: myapp:v1.2
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
