# 05_service_nodeport.yaml — NodePort Service (external via node IP)
# Usage: kubectl apply -f 05_service_nodeport.yaml -n dev
# Access: http://<node-ip>:30080

apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: dev
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80              # cluster-internal port
      targetPort: 80        # container port
      nodePort: 30080       # external port (range: 30000–32767)
      protocol: TCP
