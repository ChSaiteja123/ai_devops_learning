<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <title>Observability and Alerting Flow</title>
  <desc>Applications expose metrics, Prometheus evaluates alert rules, Alertmanager routes alerts, and operators respond.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#c4b5fd"/></marker>
  </defs>
  <rect width="1500" height="780" fill="url(#bg)"/>
  <text x="80" y="80" fill="#f8fafc" font-family="sans-serif" font-size="38" font-weight="700">Observability and alerting flow</text>
  <text x="80" y="120" fill="#ddd6fe" font-family="sans-serif" font-size="20">Metrics become actionable when rules route the right signal to the right responder.</text>
  <g filter="url(#shadow)" font-family="sans-serif" text-anchor="middle">
    <g transform="translate(85 270)"><rect width="250" height="150" rx="16" fill="#0891b2"/><text x="125" y="60" fill="white" font-size="25" font-weight="700">Applications</text><text x="125" y="98" fill="#cffafe" font-size="17">metrics + logs + traces</text></g>
    <g transform="translate(455 270)"><rect width="250" height="150" rx="16" fill="#ea580c"/><text x="125" y="60" fill="white" font-size="25" font-weight="700">Prometheus</text><text x="125" y="98" fill="#ffedd5" font-size="17">scrape + evaluate</text></g>
    <g transform="translate(825 270)"><rect width="250" height="150" rx="16" fill="#dc2626"/><text x="125" y="60" fill="white" font-size="25" font-weight="700">Alertmanager</text><text x="125" y="98" fill="#fee2e2" font-size="17">group + route + silence</text></g>
    <g transform="translate(1195 270)"><rect width="220" height="150" rx="16" fill="#16a34a"/><text x="110" y="60" fill="white" font-size="25" font-weight="700">Operators</text><text x="110" y="98" fill="#dcfce7" font-size="17">respond + recover</text></g>
  </g>
  <g stroke="#c4b5fd" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M335 345 H445"/><path d="M705 345 H815"/><path d="M1075 345 H1185"/></g>
  <rect x="420" y="545" width="660" height="110" rx="16" fill="#fbbf24" filter="url(#shadow)"/>
  <text x="750" y="592" text-anchor="middle" fill="#422006" font-family="sans-serif" font-size="24" font-weight="700">Example rule: up == 0 for 2 minutes</text>
  <text x="750" y="625" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="17">Warning or critical severity determines the notification route.</text>
  <path d="M580 420 V535" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="80" y="720" fill="#cbd5e1" font-family="sans-serif" font-size="18">Use dashboards for context, alerts for action, and runbooks for consistent recovery.</text>
</svg>
