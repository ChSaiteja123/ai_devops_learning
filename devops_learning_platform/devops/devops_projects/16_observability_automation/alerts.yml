groups:
  - name: application-health
    rules:
      - alert: ApplicationHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Application error rate is elevated
          runbook_url: https://runbooks.example.com/application-errors

      - alert: ApplicationHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Application latency is elevated
          runbook_url: https://runbooks.example.com/application-latency
