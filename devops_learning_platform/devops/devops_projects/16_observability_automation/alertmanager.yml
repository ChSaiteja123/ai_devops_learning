global:
  resolve_timeout: 5m

route:
  receiver: observability-digest
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: on-call-pager
    - matchers:
        - severity="warning"
      receiver: platform-ticketing

receivers:
  - name: on-call-pager
    webhook_configs:
      - url: http://alert-router:8080/alerts
  - name: platform-ticketing
    webhook_configs:
      - url: http://alert-router:8080/alerts
  - name: observability-digest
    webhook_configs:
      - url: http://alert-router:8080/alerts
