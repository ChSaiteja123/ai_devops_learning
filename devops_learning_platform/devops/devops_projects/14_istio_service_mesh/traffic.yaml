apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: catalog-gateway
  namespace: mesh-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - catalog.example.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: catalog
  namespace: mesh-demo
spec:
  hosts:
    - catalog
    - catalog.example.com
  gateways:
    - catalog-gateway
  http:
    - match:
        - uri:
            prefix: /
      retries:
        attempts: 2
        perTryTimeout: 1s
      timeout: 3s
      route:
        - destination:
            host: catalog
            subset: v1
          weight: 90
        - destination:
            host: catalog
            subset: v2
          weight: 10
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: catalog
  namespace: mesh-demo
spec:
  host: catalog
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
