apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: mesh-demo
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: catalog-allow-in-namespace
  namespace: mesh-demo
spec:
  selector:
    matchLabels:
      app: catalog
  rules:
    - from:
        - source:
            namespaces: ["mesh-demo", "istio-system"]
