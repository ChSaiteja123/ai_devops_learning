apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-read-config
  namespace: platform-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-read-config
  namespace: platform-demo
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform-demo
roleRef:
  kind: Role
  name: platform-api-read-config
  apiGroup: rbac.authorization.k8s.io
