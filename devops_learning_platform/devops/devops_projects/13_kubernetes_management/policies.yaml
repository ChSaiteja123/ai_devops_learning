apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: platform-demo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-limits
  namespace: platform-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-api-restricted
  namespace: platform-demo
spec:
  podSelector:
    matchLabels:
      app: platform-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-demo
  egress:
    - to:
        - namespaceSelector: {}
