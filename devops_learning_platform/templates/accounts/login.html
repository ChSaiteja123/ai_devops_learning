<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; }
        .container { max-width: 480px; margin: 80px auto; background: white; padding: 32px; border-radius: 12px; border: 1px solid #e2e8f0; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        {% if form.errors %}
            <p role="alert">Your username or password is incorrect.</p>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'' }}" />
            <label for="id_username">Username</label>
            <input id="id_username" name="username" type="text" autocomplete="username" required />
            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
        </form>
        <p><a href="/accounts/register/">Create an account</a></p>
    </div>
</body>
</html>
