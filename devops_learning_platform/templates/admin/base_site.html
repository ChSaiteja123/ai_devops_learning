{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --admin-primary: #2563eb;
        --admin-primary-dark: #1d4ed8;
        --admin-bg: #0f172a;
        --admin-panel: #111827;
        --admin-soft: #1e293b;
        --admin-border: rgba(148, 163, 184, 0.24);
        --admin-text: #e2e8f0;
    }

    body {
        background: #020817;
        color: var(--admin-text);
    }

    #header {
        background: linear-gradient(135deg, var(--admin-primary-dark), var(--admin-primary));
        border-bottom: 1px solid var(--admin-border);
    }

    #branding h1, #branding a {
        color: white !important;
        font-weight: 800;
        letter-spacing: 0.04em;
    }

    div.breadcrumbs {
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid var(--admin-border);
        color: #cbd5e1;
    }

    .module {
        background: var(--admin-panel);
        border: 1px solid var(--admin-border);
        border-radius: 14px;
        box-shadow: 0 18px 35px rgba(2, 8, 23, 0.25);
    }

    .module h2, .module caption, .module th {
        color: var(--admin-text) !important;
    }

    .module a, .table a {
        color: #93c5fd !important;
    }

    .object-tools a, .submit-row input {
        background: linear-gradient(135deg, #22d3ee, #60a5fa);
        border: none;
        color: #03111f !important;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block title %}DevOps Learning Platform Admin{% endblock %}
{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">🚀 DevOps Learning Platform</a></h1>
{% endblock %}
