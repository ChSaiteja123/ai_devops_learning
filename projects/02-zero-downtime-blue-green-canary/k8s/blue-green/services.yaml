apiVersion: v1
kind: Service
metadata:
  name: sample-api-active
spec:
  type: ClusterIP
  selector:
    app: sample-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-preview
spec:
  type: ClusterIP
  selector:
    app: sample-api
  ports:
    - name: http
      port: 8081
      targetPort: http
