<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">AWS cost optimization workflow</title>
  <desc id="desc">A schedule invokes a read-only scanner that evaluates AWS resources against rules and exclusions, stores a report, and asks owners to review recommendations. Any remediation requires separate approval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526579"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183247}.title{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#40566a}.box{rx:12;stroke-width:2}.arrow{stroke:#526579;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="430" rx="18" fill="#f5f8fc"/>
  <text x="40" y="48" class="title">AWS cost optimization: report first</text>
  <text x="40" y="76" class="small">Discovery is read-only. A finding is a recommendation, not proof a resource is safe to remove.</text>
  <rect class="box" x="40" y="150" width="150" height="85" fill="#e7f1ff" stroke="#4382c3"/><text x="115" y="184" text-anchor="middle" class="label">Schedule</text><text x="115" y="208" text-anchor="middle" class="small">EventBridge</text>
  <rect class="box" x="250" y="150" width="180" height="85" fill="#e5f7ef" stroke="#3b9b70"/><text x="340" y="184" text-anchor="middle" class="label">Read-only scanner</text><text x="340" y="208" text-anchor="middle" class="small">Lambda + boto3</text>
  <rect class="box" x="495" y="150" width="180" height="85" fill="#fff2d9" stroke="#d39528"/><text x="585" y="184" text-anchor="middle" class="label">Rules + exclusions</text><text x="585" y="208" text-anchor="middle" class="small">evidence, owner, tags</text>
  <rect class="box" x="740" y="100" width="210" height="78" fill="#f0eaff" stroke="#8060bd"/><text x="845" y="132" text-anchor="middle" class="label">Report storage</text><text x="845" y="156" text-anchor="middle" class="small">S3 / timestamped findings</text>
  <rect class="box" x="740" y="220" width="210" height="78" fill="#e7f1ff" stroke="#4382c3"/><text x="845" y="252" text-anchor="middle" class="label">Owner notification</text><text x="845" y="276" text-anchor="middle" class="small">SNS / Slack</text>
  <path class="arrow" d="M190 192 H245"/><path class="arrow" d="M430 192 H490"/><path class="arrow" d="M675 175 H720 V140 H735"/><path class="arrow" d="M675 210 H720 V260 H735"/>
  <rect class="box" x="330" y="325" width="220" height="70" fill="#ffe8e5" stroke="#d16b5d"/><text x="440" y="354" text-anchor="middle" class="label">Approval gate</text><text x="440" y="377" text-anchor="middle" class="small">human decision + audit</text>
  <rect class="box" x="650" y="325" width="250" height="70" fill="#e5f7ef" stroke="#3b9b70"/><text x="775" y="354" text-anchor="middle" class="label">Optional remediation</text><text x="775" y="377" text-anchor="middle" class="small">separate role / dry-run / recovery</text>
  <path class="arrow" d="M845 298 V315 H550 V350"/><path class="arrow" d="M550 360 H645"/>
</svg>
