<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">GitOps EKS platform architecture</title>
  <desc id="desc">A developer pushes application code, CI tests and scans it, publishes an image, and Argo CD deploys Git configuration to EKS. Prometheus feeds Grafana and alerts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526579"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#183247}.title{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#40566a}.box{rx:12;stroke-width:2}.arrow{stroke:#526579;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="430" rx="18" fill="#f5f8fc"/>
  <text x="40" y="48" class="title">GitOps EKS platform</text>
  <text x="40" y="76" class="small">Infrastructure is provisioned separately; application delivery follows Git as the source of truth.</text>
  <rect class="box" x="35" y="140" width="160" height="90" fill="#e7f1ff" stroke="#4382c3"/>
  <text x="115" y="176" text-anchor="middle" class="label">Developer</text><text x="115" y="201" text-anchor="middle" class="small">pushes code</text>
  <rect class="box" x="250" y="140" width="190" height="90" fill="#fff2d9" stroke="#d39528"/>
  <text x="345" y="176" text-anchor="middle" class="label">CI pipeline</text><text x="345" y="201" text-anchor="middle" class="small">test • scan • build</text>
  <rect class="box" x="495" y="140" width="175" height="90" fill="#e5f7ef" stroke="#3b9b70"/>
  <text x="582" y="176" text-anchor="middle" class="label">Image registry</text><text x="582" y="201" text-anchor="middle" class="small">immutable image tag</text>
  <rect class="box" x="735" y="140" width="220" height="90" fill="#f0eaff" stroke="#8060bd"/>
  <text x="845" y="176" text-anchor="middle" class="label">Argo CD → EKS</text><text x="845" y="201" text-anchor="middle" class="small">sync desired state from Git</text>
  <path class="arrow" d="M195 185 H245"/><path class="arrow" d="M440 185 H490"/><path class="arrow" d="M670 185 H730"/>
  <rect class="box" x="250" y="300" width="190" height="78" fill="#e7f1ff" stroke="#4382c3"/>
  <text x="345" y="332" text-anchor="middle" class="label">GitOps repository</text><text x="345" y="355" text-anchor="middle" class="small">manifests / Helm values</text>
  <path class="arrow" d="M345 300 V239 H820 V235"/>
  <rect class="box" x="535" y="300" width="175" height="78" fill="#e5f7ef" stroke="#3b9b70"/>
  <text x="622" y="332" text-anchor="middle" class="label">Prometheus</text><text x="622" y="355" text-anchor="middle" class="small">metrics and alerts</text>
  <rect class="box" x="770" y="300" width="185" height="78" fill="#fff2d9" stroke="#d39528"/>
  <text x="862" y="332" text-anchor="middle" class="label">Grafana / Slack</text><text x="862" y="355" text-anchor="middle" class="small">dashboards / notifications</text>
  <path class="arrow" d="M845 235 V270 H622 V295"/><path class="arrow" d="M710 339 H765"/>
</svg>
