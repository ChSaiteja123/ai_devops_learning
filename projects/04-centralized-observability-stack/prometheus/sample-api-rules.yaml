apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample-api-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: sample-api
      rules:
        - alert: SampleApiTargetMissing
          expr: up{job="sample-api"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Sample API scrape target is unavailable
            description: Prometheus has failed to scrape the sample-api target for two minutes.
        - alert: SampleApiHighHttp5xxRate
          expr: |
            sum(rate(http_requests_total{job="sample-api",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="sample-api"}[5m])), 1)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Sample API HTTP 5xx rate is above 5%
            description: Check the sample-api dashboard and application logs.
