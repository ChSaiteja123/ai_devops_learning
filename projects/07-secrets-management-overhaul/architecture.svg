<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Secrets management architecture</title>
  <desc id="desc">Source changes are scanned in CI, workloads use identity to request only authorized secrets from a secret manager, rotation is audited, and secret values are not stored in source code.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526579"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183247}.title{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#40566a}.box{rx:12;stroke-width:2}.arrow{stroke:#526579;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="430" rx="18" fill="#f5f8fc"/>
  <text x="40" y="48" class="title">Secrets management and rotation</text>
  <text x="40" y="76" class="small">Store secret values centrally; let workload identity control narrowly scoped runtime access.</text>
  <rect class="box" x="40" y="150" width="175" height="90" fill="#e7f1ff" stroke="#4382c3"/><text x="127" y="185" text-anchor="middle" class="label">Source repository</text><text x="127" y="210" text-anchor="middle" class="small">no secret values</text>
  <rect class="box" x="285" y="150" width="175" height="90" fill="#fff2d9" stroke="#d39528"/><text x="372" y="185" text-anchor="middle" class="label">Secret scanning</text><text x="372" y="210" text-anchor="middle" class="small">pre-commit + CI</text>
  <rect class="box" x="545" y="100" width="190" height="90" fill="#f0eaff" stroke="#8060bd"/><text x="640" y="136" text-anchor="middle" class="label">Workload identity</text><text x="640" y="161" text-anchor="middle" class="small">IAM role / Vault auth</text>
  <rect class="box" x="545" y="235" width="190" height="90" fill="#e5f7ef" stroke="#3b9b70"/><text x="640" y="271" text-anchor="middle" class="label">Secret manager</text><text x="640" y="296" text-anchor="middle" class="small">scoped access • rotation</text>
  <rect class="box" x="810" y="150" width="150" height="90" fill="#e7f1ff" stroke="#4382c3"/><text x="885" y="185" text-anchor="middle" class="label">Application</text><text x="885" y="210" text-anchor="middle" class="small">runtime retrieval</text>
  <path class="arrow" d="M215 195 H280"/><path class="arrow" d="M460 195 H500 V145 H540"/><path class="arrow" d="M735 145 H780 V185 H805"/><path class="arrow" d="M810 215 H775 V280 H740"/>
  <rect class="box" x="295" y="330" width="210" height="65" fill="#ffe8e5" stroke="#d16b5d"/><text x="400" y="358" text-anchor="middle" class="label">Audit and alerts</text><text x="400" y="380" text-anchor="middle" class="small">access • rotation events</text>
  <rect class="box" x="545" y="345" width="190" height="60" fill="#fff2d9" stroke="#d39528"/><text x="640" y="373" text-anchor="middle" class="label">Test rotation</text><text x="640" y="393" text-anchor="middle" class="small">verify consumers recover</text>
  <path class="arrow" d="M640 325 V340"/><path class="arrow" d="M545 375 H510"/>
</svg>
